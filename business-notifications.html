<script>
(function(){
  var list = document.getElementById("bizNotifList");
  var empty = document.getElementById("bizNotifEmpty");
  var clearSkeleton = MadaUI.skeleton(list, { rows: 3 });
  MadaDB.getNotifications(MadaSession.currentBusinessUid()).then(function(items){
    clearSkeleton();
    if(!items.length){ empty.classList.remove("hidden"); return; }
    list.innerHTML = items.map(function(n){
      return '<div class="mada-notif-row'+(n.read ? "" : " unread")+'" data-notif="'+n.notificationId+'">'+
        '<span class="mada-notif-dot"></span>'+
        '<div class="mada-notif-text"><h3>'+n.title+'</h3><p class="muted">'+n.body+'</p></div>'+
        (n.read ? "" : '<span class="badge green">جديد</span>')+
        '</div>';
    }).join("");
    list.querySelectorAll("[data-notif]").forEach(function(card){
      card.addEventListener("click", function(){ MadaDB.markNotificationRead(card.getAttribute("data-notif")); });
    });
  });
})();
</script>
