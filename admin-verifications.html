<script>
document.querySelectorAll("[data-verify-approve]").forEach(function(btn){
  btn.addEventListener("click", function(){
    MadaUI.confirm({ title: "اعتماد التوثيق", body: "سيتم منح هذا الحساب علامة موثّق ✓ ويصبح ظاهرًا للجميع." }).then(function(ok){
      if(!ok) return;
      btn.textContent = "تم التوثيق ✓";
      btn.disabled = true;
      btn.classList.remove("green");
      btn.classList.add("light");
      MadaUI.toast("تم اعتماد التوثيق بنجاح", "success");
    });
  });
});
